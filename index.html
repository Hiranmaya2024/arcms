<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Order System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { --primary: #2563eb; --secondary: #64748b; --success: #059669; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        h2 { color: #1e293b; border-left: 5px solid var(--primary); padding-left: 15px; margin-bottom: 25px; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.95rem; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        tr:hover { background-color: #f1f5f9; }

        /* Form Inputs */
        input[type="number"] { width: 70px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .btn-page { padding: 8px 16px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; border-radius: 6px; font-weight: 600; }
        .btn-page:disabled { border-color: #cbd5e1; color: #cbd5e1; cursor: not-allowed; }
        .btn-page:hover:not(:disabled) { background: var(--primary); color: white; }

        /* Summary Section */
        #orderSummarySection { margin-top: 40px; padding: 20px; border: 2px dashed #cbd5e1; border-radius: 8px; display: none; background: #fff; }
        .grand-total { font-size: 1.5rem; font-weight: bold; text-align: right; margin: 20px 0; color: #1e293b; }
        
        .action-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-order { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn-download { background: var(--success); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn-order:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h2>Inventory Management & Ordering</h2>
    
    <div id="loading">Fetching items from Google Sheets...</div>
    
    <table id="mainTable" style="display:none;">
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Company</th>
                <th>MRP</th>
                <th>Rate (₹)</th>
                <th>Stock</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
    </table>

    <div class="pagination" id="pager" style="display:none;">
        <button class="btn-page" id="prevBtn" onclick="changePage(-1)">← Previous</button>
        <span id="pageInfo">Page 1</span>
        <button class="btn-page" id="nextBtn" onclick="changePage(1)">Next →</button>
    </div>

    <div class="action-btns">
        <button class="btn-order" onclick="generateSummary()">Review & Place Order</button>
    </div>

    <div id="orderSummarySection">
        <h3 style="color: var(--success);">Order Preview</h3>
        <table id="summaryTable">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>MRP</th>
                    <th>Rate</th>
                    <th>Qty</th>
                    <th>Total (₹)</th>
                </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
        </table>
        <div class="grand-total">Grand Total: ₹<span id="grandTotalDisplay">0.00</span></div>
        <div class="action-btns">
            <button class="btn-download" onclick="downloadPDF()">Download PDF Invoice</button>
        </div>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTJmM74VQeW2jYoTPI9u4PN95ZrqFnMOtDDNY6wTCikoWCN8rmwvfOfxOoZ8AziWiLCRDs6Df-PTQkM/pub?output=csv';
    
    let products = [];
    let cart = {}; // Stores { productIndex: quantity }
    let currentPage = 1;
    const rowsPerPage = 10;

    async function loadData() {
        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();
            const rows = text.split('\n').map(row => row.split(','));
            
            // Map rows: 0:Item, 1:Stock, 2:MRP, 3:Rate, 4:Company, 5:Batch, 6:Expire
            products = rows.slice(1).filter(r => r[0]); 
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainTable').style.display = 'table';
            document.getElementById('pager').style.display = 'flex';
            render();
        } catch (err) {
            document.getElementById('loading').innerText = "Error: Check sheet permissions.";
        }
    }

    function render() {
        const body = document.getElementById('inventoryBody');
        body.innerHTML = '';
        
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageItems = products.slice(start, end);

        pageItems.forEach((p, i) => {
            const actualIndex = start + i;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><b>${p[0]}</b><br><small>Exp: ${p[6] || 'N/A'}</small></td>
                <td>${p[4]}</td>
                <td>₹${p[2]}</td>
                <td style="font-weight:bold; color:var(--primary)">₹${p[3]}</td>
                <td>${p[1]}</td>
                <td><input type="number" min="0" max="${p[1]}" value="${cart[actualIndex] || 0}" 
                    onchange="updateCart(${actualIndex}, this.value)"></td>
            `;
            body.appendChild(row);
        });

        updateUI();
    }

    function updateCart(idx, val) {
        cart[idx] = parseInt(val) || 0;
    }

    function changePage(dir) {
        currentPage += dir;
        render();
        window.scrollTo(0,0);
    }

    function updateUI() {
        const totalPages = Math.ceil(products.length / rowsPerPage);
        document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage === totalPages;
    }

    let currentOrder = [];
    let finalGrandTotal = 0;

    function generateSummary() {
        const summaryBody = document.getElementById('summaryBody');
        summaryBody.innerHTML = '';
        currentOrder = [];
        finalGrandTotal = 0;

        Object.keys(cart).forEach(idx => {
            if (cart[idx] > 0) {
                const p = products[idx];
                const total = p[3] * cart[idx];
                finalGrandTotal += total;
                
                currentOrder.push({
                    name: p[0],
                    mrp: p[2],
                    rate: p[3],
                    qty: cart[idx],
                    total: total.toFixed(2)
                });

                summaryBody.innerHTML += `
                    <tr>
                        <td>${p[0]}</td>
                        <td>₹${p[2]}</td>
                        <td>₹${p[3]}</td>
                        <td>${cart[idx]}</td>
                        <td>₹${total.toFixed(2)}</td>
                    </tr>
                `;
            }
        });

        if (currentOrder.length === 0) {
            alert("Please add at least one item to the order.");
            return;
        }

        document.getElementById('grandTotalDisplay').innerText = finalGrandTotal.toFixed(2);
        document.getElementById('orderSummarySection').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.text("PURCHASE ORDER", 14, 20);
        
        doc.setFontSize(10);
        doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 28);
        
        const tableData = currentOrder.map(item => [
            item.name,
            `Rs. ${item.mrp}`,
            `Rs. ${item.rate}`,
            item.qty,
            `Rs. ${item.total}`
        ]);

        doc.autoTable({
            startY: 35,
            head: [['Item Name', 'MRP', 'Rate', 'Qty', 'Total']],
            body: tableData,
            theme: 'grid',
            headStyles: { fillColor: [37, 99, 235] }
        });

        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(14);
        doc.text(`Grand Total: Rs. ${finalGrandTotal.toFixed(2)}`, 140, finalY);

        doc.save(`Order_${Date.now()}.pdf`);
    }

    loadData();
</script>

</body>
</html>
